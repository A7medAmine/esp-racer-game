; PlatformIO build for the ESP Racer controller.
; Usage (from this folder):  pio run -t upload   then   pio device monitor
; The sources live in esp-racer-controller/ so the same folder also opens in Arduino IDE.

[platformio]
src_dir = esp-racer-controller
default_envs = nodemcuv2

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    links2004/WebSockets@^2.6.1

[env:nodemcuv2]
board = nodemcuv2

[env:d1_mini]
board = d1_mini
